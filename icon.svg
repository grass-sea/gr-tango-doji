<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">TANGR GR monogram</title>
  <desc id="desc">A blue intertwined GR monogram with a small teal-green sprout, representing Grass and growth.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#36A5E8"/>
      <stop offset="1" stop-color="#0872B9"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8BD78D"/>
      <stop offset="1" stop-color="#159A91"/>
    </linearGradient>
  </defs>
  <!-- G: a broad, open circular stroke with a gently rising inner bar -->
  <path d="M 500 390
           C 455 350, 411 329, 354 329
           C 253 329, 181 400, 181 503
           C 181 606, 254 679, 354 679
           C 437 679, 495 630, 513 554
           L 513 500
           L 399 500
           C 363 500, 337 516, 320 542
           C 346 527, 370 526, 400 534
           L 462 550
           C 447 600, 406 625, 356 625
           C 286 625, 235 573, 235 503
           C 235 433, 286 383, 356 383
           C 400 383, 438 401, 470 431 Z"
        fill="url(#blue)"/>
  <!-- R: custom ribbon-like letterform, visually interlocked with G -->
  <path d="M 505 431
           C 519 375, 563 338, 632 338
           L 696 338
           C 770 338, 819 383, 819 447
           C 819 509, 777 550, 718 557
           L 821 676
           L 750 676
           L 632 535
           L 695 535
           C 735 535, 764 502, 764 450
           C 764 414, 738 389, 696 389
           L 632 389
           C 583 389, 557 419, 557 465
           L 557 610
           C 557 642, 538 666, 505 676 Z"
        fill="url(#blue)"/>
  <!-- Sprout: the Grass / growth meaning -->
  <path d="M 513 374
           C 510 319, 526 270, 569 237
           C 600 213, 635 204, 661 203
           C 660 245, 645 284, 618 313
           C 591 341, 554 357, 513 374 Z"
        fill="url(#green)"/>
  <path d="M 502 352
           C 493 312, 469 290, 436 285
           C 436 319, 457 343, 502 352 Z"
        fill="url(#green)"/>
  <path d="M 514 374 C 529 322, 568 272, 620 235" fill="none" stroke="#F8FFFA" stroke-width="5" stroke-linecap="round"/>
</svg>
